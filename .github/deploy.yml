name: Deploy
on:
  push:
    branches: ["CICD_test"]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Prepare CodeDeploy bundle
        run: |
          rm -rf deploy deployment_bundle.zip
          mkdir deploy
          rsync -av \
            --exclude deploy \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude deployment_bundle.zip \
            ./ deploy/

      - name: Zip deployment bundle
        run: |
          cd deploy
          zip -r ../deployment_bundle.zip .

      - name: Upload to S3
        run: |
          aws s3 cp deployment_bundle.zip s3://ks-chicken/deployments/server/deployment_bundle${{ github.sha }}.zip

      - name: Trigger CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name ks-chicken-test \
            --deployment-group-name server \
            --s3-location bucket=ks-chicken,bundleType=zip,key=deployments/server/deployment_bundle${{ github.sha }}.zip \
